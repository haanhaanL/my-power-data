      - name: 提交更新后的数据
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          
          # 只提交这三个文件
          git add power_data.csv chart.png index.html
          
          if git diff --staged --quiet; then
            echo "没有变更"
            exit 0
          fi
          
          git commit -m "自动更新数据 $(date -u '+%Y-%m-%d %H:%M')"

          for i in 1 2 3 4 5; do
            if git push origin HEAD:${{ github.ref_name }}; then
              echo "push 成功"
              exit 0
            fi
            echo "push 失败，第 $i 次重试..."
            git pull --rebase origin ${{ github.ref_name }}
            if [ $? -ne 0 ]; then
              git checkout --ours power_data.csv chart.png index.html 2>/dev/null || true
              git add power_data.csv chart.png index.html 2>/dev/null || true
              git rebase --continue 2>/dev/null || true
            fi
            sleep $((i * 3))
          done
          echo "重试 5 次后仍失败"
          exit 1
