<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>团建数据追踪</title>
    <script src="https://cdn.jsdelivr.net/npm/echarts@5.5.0/dist/echarts.min.js"></script>
    <script src="https://cdn.bootcdn.net/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script>
    <style>
        body {
            margin: 0; padding: 8px; background-color: #faf8f6;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            display: flex; flex-direction: column; align-items: center; overflow-x: hidden;
        }
        .container { width: 100%; max-width: 1200px; }

        /* 顶部区域 */
        .top-header {
            text-align: center;
            margin-bottom: 12px;
            padding: 10px 0;
        }
        .main-title {
            color: #ff8f40;
            font-size: 20px;
            font-weight: bold;
            margin-bottom: 10px;
        }
        .update-time {
            color: #888;
            font-size: 12px;
            margin-top: 12px;
        }

        /* 统计框 */
        .stats-wrap { text-align: center; padding: 0 10px; }
        .stats {
            font-size: 13px; font-weight: normal; color: #555;
            background: #fff8f3; border: 1px solid rgba(255,143,64,0.2);
            border-radius: 12px; padding: 8px 16px; display: inline-block;
            line-height: 1.6; box-shadow: 0 2px 6px rgba(255,143,64,0.04);
        }
        .stats .val-text { color: #ff8f40; font-weight: bold; }
        .stats .diff-up { color: #FF69B4; font-weight: bold; }
        .stats .diff-down { color: #999999; font-weight: bold; }

        /* 卡片 */
        .card {
            background: white; border-radius: 12px; box-shadow: 0 4px 12px rgba(255,143,64,0.08);
            padding: 12px 0; margin-bottom: 12px; overflow: hidden; border: 1px solid rgba(255,143,64,0.10);
            display: flex; flex-direction: column;
        }
        .title {
            text-align: center; color: #ff8f40; font-size: 15px; font-weight: bold; margin: 5px 0 10px 0;
        }
        h3 { text-align: center; color: #ff8f40; margin: 0 0 10px 0; font-size: 15px; }

        /* 表格滚动 */
        .table-scroll-box {
            width: 100%; overflow-x: auto; -webkit-overflow-scrolling: touch;
        }
        .table-scroll-box::-webkit-scrollbar { display: none; }

        /* 表格 - 与容器等宽 */
        table {
            width: 100%; border-collapse: separate; border-spacing: 0;
            font-size: 12px;
        }
        th, td {
            padding: 10px 6px; text-align: center; border-bottom: 1px solid #f5e8e0;
            white-space: nowrap; line-height: 1.5;
        }
        th {
            background-color: #ff8f40; color: #ffffff; font-weight: bold;
            font-size: 12px; position: sticky; top: 0; z-index: 2;
            border: 1px solid rgba(255, 255, 255, 0.3); box-shadow: 0 1px 0 #f5e8e0;
        }
        /* 首列（时间）：居中，仅文字颜色 */
        td:first-child {
            text-align: center; color: #ff8f40; font-weight: bold;
        }
        /* 数据列：右对齐 */
        td:not(:first-child) {
            text-align: right;
        }
        th:not(:first-child) {
            text-align: right;
        }
        tbody tr:nth-child(even) { background-color: #ff8f400a; }

        .val-total { font-weight: bold; color: #333; }
        .val-people { font-weight: bold; color: #333; }
        .up { color: #ff8f40; font-weight: bold; }
        .down { color: #27ae60; font-weight: bold; }

        #loading { text-align: center; color: #ff8f40; font-size: 16px; margin-top: 50px; font-weight: bold; }

        /* 图表双列布局 */
        .chart-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
            width: 100%;
            margin-bottom: 12px;
        }
        .chart-wrapper { width: 100%; height: 350px; }

        /* 手机适配 */
        @media (max-width: 1000px) {
            .chart-grid { grid-template-columns: 1fr; }
            .chart-wrapper { height: 300px; }
            th, td { padding: 8px 4px; font-size: 11px; }
        }
    </style>
</head>
<body>
    <div class="container">
        <div id="loading">正在加载数据...</div>

        <div id="main-content" style="display: none;">
            <!-- 顶部 -->
            <div class="top-header">
                <div class="main-title">团建数据表</div>
                <div class="stats-wrap">
                    <div class="stats" id="tableSumStats"></div>
                </div>
                <div class="update-time" id="updateTime">数据最后更新：加载中...</div>
            </div>

            <!-- 表格卡片：单独一行 -->
            <div class="card">
                <h3 id="tableTitle">数据明细 (最近10条)</h3>
                <div class="table-scroll-box">
                    <table id="dataTable">
                        <thead>
                            <tr>
                                <th>时间</th>
                                <th>总电力值</th>
                                <th>总电增幅</th>
                                <th>总发电人数</th>
                                <th>发电人数增幅</th>
                            </tr>
                        </thead>
                        <tbody></tbody>
                    </table>
                </div>
            </div>

            <!-- 图表双列：总电力增幅 & 总发电人数增幅 -->
            <div class="chart-grid">
                <div class="card">
                    <div class="title" id="chartTitleTotal">总电力增幅</div>
                    <div class="chart-wrapper" id="chartTotal"></div>
                </div>
                <div class="card">
                    <div class="title" id="chartTitlePeople">总发电人数增幅</div>
                    <div class="chart-wrapper" id="chartPeople"></div>
                </div>
            </div>
        </div>
    </div>

    <script>
        function parseTimeStr(str) {
            if (!str) return "";
            let parts = str.split(' ');
            if (parts.length > 1) {
                let timeParts = parts[1].split(':');
                if (timeParts.length >= 1) {
                    let hour = parseInt(timeParts[0], 10);
                    return (hour < 10 ? '0' + hour : hour) + ':00';
                }
            }
            return str;
        }

        function formatNum(num) {
            return num ? Number(num).toLocaleString() : '-';
        }

        function formatDelta(num) {
            if (num === null || num === undefined || num === '' || isNaN(num)) return '-';
            const val = Number(num);
            if (val > 0) return `<span class="up">+${val.toLocaleString()}</span>`;
            if (val < 0) return `<span class="down">${val.toLocaleString()}</span>`;
            return '0';
        }

        function getNum(val) {
            if (val === '' || val === undefined || val === null) return null;
            const num = Number(val);
            return isNaN(num) ? null : num;
        }

        function formatW(v) {
            return (v / 10000).toFixed(1) + 'w';
        }

        // 初始化两个图表
        const chartTotal = echarts.init(document.getElementById('chartTotal'));
        const chartPeople = echarts.init(document.getElementById('chartPeople'));

        chartTotal.showLoading();
        chartPeople.showLoading();

        let globalDataMap = {};
        let latestDate = '';

        Papa.parse('power_data.csv?t=' + new Date().getTime(), {
            download: true,
            header: true,
            skipEmptyLines: true,
            encoding: "UTF-8",
            complete: function(results) {
                document.getElementById('loading').style.display = 'none';
                document.getElementById('main-content').style.display = 'block';

                const data = results.data;
                const datesSet = new Set();
                let latestTimeStr = '';

                data.forEach(row => {
                    const timeStr = row["时间"];
                    if (!timeStr) return;

                    latestTimeStr = timeStr;

                    const datePart = timeStr.split(' ')[0].replace(/\//g, '-');
                    const dArr = datePart.split('-');
                    if (dArr.length !== 3) return;

                    const formattedDate = `${dArr[0]}-${dArr[1].padStart(2,'0')}-${dArr[2].padStart(2,'0')}`;
                    if (formattedDate < '2026-11-01') return;

                    const timeHour = parseTimeStr(timeStr);
                    datesSet.add(formattedDate);

                    if (!globalDataMap[formattedDate]) globalDataMap[formattedDate] = {};

                    globalDataMap[formattedDate][timeHour] = {
                        totalPower: getNum(row["总电力值"]),
                        totalDelta: getNum(row["增幅_2"]),
                        totalPeople: getNum(row["总发电人数"]),
                        totalPeopleDelta: getNum(row["增幅_3"])
                    };
                });

                if (latestTimeStr) {
                    document.getElementById('updateTime').innerText = `数据最后更新：${latestTimeStr}`;
                }

                const sortedDates = Array.from(datesSet).sort().reverse();
                latestDate = sortedDates[0] || '';

                renderPage(latestDate);
            },
            error: function(err) {
                document.getElementById('loading').innerText = "加载数据失败，请确保 power_data.csv 在同目录下。";
                console.error(err);
            }
        });

        function renderPage(selectedDate) {
            const dataMap = globalDataMap;
            const selDateObj = new Date(selectedDate);
            const prevDateObj = new Date(selDateObj);
            prevDateObj.setDate(prevDateObj.getDate() - 1);
            const prevDateStr = prevDateObj.toISOString().split('T')[0];

            // === 顶部统计：今日总电力增幅 ===
            let selectedTotalDelta = 0;
            let prevTotalDelta = 0;

            if (dataMap[selectedDate]) {
                Object.values(dataMap[selectedDate]).forEach(d => {
                    if (d.totalDelta) selectedTotalDelta += d.totalDelta;
                });
            }
            if (dataMap[prevDateStr]) {
                Object.values(dataMap[prevDateStr]).forEach(d => {
                    if (d.totalDelta) prevTotalDelta += d.totalDelta;
                });
            }

            const diff = selectedTotalDelta - prevTotalDelta;
            let diffStr = '';
            if (diff > 0) {
                diffStr = `<span class="diff-up">(+${formatW(diff)})</span>`;
            } else if (diff < 0) {
                diffStr = `<span class="diff-down">(${formatW(diff)})</span>`;
            } else {
                diffStr = `(0)`;
            }

            document.getElementById('tableSumStats').innerHTML =
                `今日总电力增幅：<span class="val-text">${formatW(selectedTotalDelta)}</span> ${diffStr}`;

            document.getElementById('tableTitle').innerText = `数据明细 (最近10条)`;
            document.getElementById('chartTitleTotal').innerText = `总电力增幅`;
            document.getElementById('chartTitlePeople').innerText = `总发电人数增幅`;

            // 准备表格数据
            let dayDataList = [];
            if (dataMap[selectedDate]) {
                for (const [time, data] of Object.entries(dataMap[selectedDate])) {
                    dayDataList.push({ time, ...data });
                }
                dayDataList.sort((a, b) => b.time.localeCompare(a.time));
            }

            const latestRows = dayDataList.slice(0, 10);
            const tbody = document.querySelector('#dataTable tbody');
            tbody.innerHTML = '';

            if (latestRows.length === 0) {
                tbody.innerHTML = '<tr><td colspan="5" style="text-align:center;color:#999;">暂无数据</td></tr>';
            } else {
                latestRows.forEach(row => {
                    const tr = document.createElement('tr');
                    tr.innerHTML = `
                        <td>${row.time}</td>
                        <td class="val-total">${formatNum(row.totalPower)}</td>
                        <td>${formatDelta(row.totalDelta)}</td>
                        <td class="val-people">${formatNum(row.totalPeople)}</td>
                        <td>${formatDelta(row.totalPeopleDelta)}</td>
                    `;
                    tbody.appendChild(tr);
                });
            }

            // x轴小时
            const xAxisHours = [];
            for (let i = 0; i <= 24; i++) {
                xAxisHours.push((i < 10 ? '0'+i : i) + ':00');
            }

            function getSeriesData(date, key) {
                return xAxisHours.map(h => {
                    if (dataMap[date] && dataMap[date][h] && dataMap[date][h][key] !== undefined) {
                        return dataMap[date][h][key];
                    }
                    if (h === '00:00' && dataMap[date]) return 0;
                    return null;
                });
            }

            // 获取最近5日日期（包含选中日期在内，按日期倒序取5天）
            const allDates = Object.keys(dataMap).sort().reverse();
            const recent5Dates = allDates.slice(0, 5).reverse(); // 正序排列便于图例

            // 构建两个图表的 series（仅最近5日）
            const totalDeltaSeries = [];
            const peopleDeltaSeries = [];

            recent5Dates.forEach(date => {
                const shortName = date.substring(5);
                const isSelected = date === selectedDate;
                const isPrev = date === prevDateStr;

                let color, width, symbol, lineType;
                if (isSelected) {
                    color = '#ff8f40'; width = 2.5; symbol = 'circle'; lineType = 'solid';
                } else if (isPrev) {
                    color = '#FFB3C6'; width = 2; symbol = 'circle'; lineType = 'solid';
                } else {
                    color = '#b0b0b0'; width = 1.5; symbol = 'none'; lineType = 'dashed';
                }

                totalDeltaSeries.push({
                    name: shortName,
                    type: 'line',
                    data: getSeriesData(date, 'totalDelta'),
                    smooth: false,
                    symbol: symbol,
                    symbolSize: 4,
                    itemStyle: { color: color },
                    lineStyle: { color: color, width: width, type: lineType },
                    emphasis: { disabled: !isSelected && !isPrev }
                });

                peopleDeltaSeries.push({
                    name: shortName,
                    type: 'line',
                    data: getSeriesData(date, 'totalPeopleDelta'),
                    smooth: false,
                    symbol: symbol,
                    symbolSize: 4,
                    itemStyle: { color: color },
                    lineStyle: { color: color, width: width, type: lineType },
                    emphasis: { disabled: !isSelected && !isPrev }
                });
            });

            // 图例顺序：最近5日按日期正序
            const legendOrder = recent5Dates.map(d => d.substring(5));

            // 图例索引：用于 tooltip 倒序排列（索引值越大日期越新）
            const legendIndex = {};
            legendOrder.forEach((name, i) => { legendIndex[name] = i; });

            const defaultTooltipFormatter = function(params) {
                if (!params || !params.length) return '';
                // 按日期倒序：索引大的（最近日期）排在前面
                const sorted = params.slice().sort((a, b) =>
                    (legendIndex[b.seriesName] ?? -1) - (legendIndex[a.seriesName] ?? -1)
                );
                let result = `<div style="display: grid; grid-template-columns: max-content max-content; gap: 8px; align-items: center; min-width: 130px;">`;
                result += `<div style="grid-column: 1 / -1; text-align: left; font-size: 13px; font-weight: bold; margin-bottom: 4px; color: #333;">${params[0].axisValue}</div>`;

                sorted.forEach(p => {
                    if (p.value === null || p.value === undefined) return;
                    result += `<div style="text-align: left;">${p.marker} ${p.seriesName}</div>`;
                    result += `<div style="text-align: right; font-weight: bold;">${p.value.toLocaleString()}</div>`;
                });
                result += `</div>`;
                return result;
            };

            // 渲染总电力增幅图表
            chartTotal.hideLoading();
            chartTotal.setOption({
                tooltip: { trigger: 'axis', confine: true, formatter: defaultTooltipFormatter },
                legend: { top: '0%', itemWidth: 12, itemHeight: 8, textStyle: { fontSize: 12, color: '#666' }, type: 'scroll', data: legendOrder },
                grid: { left: '2%', right: '5%', bottom: '10%', top: '18%', containLabel: true },
                xAxis: { type: 'category', boundaryGap: false, data: xAxisHours, axisLabel: { interval: 1, fontSize: 11, color: '#888' }, axisLine: { lineStyle: { color: '#f0e0d6' } } },
                yAxis: { type: 'value', scale: true, axisLabel: { fontSize: 11, color: '#888', formatter: formatW }, axisLine: { lineStyle: { color: '#f0e0d6' } }, splitLine: { lineStyle: { color: '#faf3ef' } } },
                series: totalDeltaSeries
            }, true);

            // 渲染总发电人数增幅图表
            chartPeople.hideLoading();
            chartPeople.setOption({
                tooltip: { trigger: 'axis', confine: true, formatter: defaultTooltipFormatter },
                legend: { top: '0%', itemWidth: 12, itemHeight: 8, textStyle: { fontSize: 12, color: '#666' }, type: 'scroll', data: legendOrder },
                grid: { left: '2%', right: '5%', bottom: '10%', top: '18%', containLabel: true },
                xAxis: { type: 'category', boundaryGap: false, data: xAxisHours, axisLabel: { interval: 1, fontSize: 11, color: '#888' }, axisLine: { lineStyle: { color: '#f0e0d6' } } },
                yAxis: { type: 'value', scale: true, axisLabel: { fontSize: 11, color: '#888', formatter: formatW }, axisLine: { lineStyle: { color: '#f0e0d6' } }, splitLine: { lineStyle: { color: '#faf3ef' } } },
                series: peopleDeltaSeries
            }, true);

            setTimeout(() => {
                chartTotal.resize();
                chartPeople.resize();
            }, 100);
        }

        let resizeTimer;
        window.addEventListener('resize', function() {
            clearTimeout(resizeTimer);
            resizeTimer = setTimeout(function() {
                chartTotal.resize();
                chartPeople.resize();
            }, 200);
        });
    </script>
</body>
</html>
