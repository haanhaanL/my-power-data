<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>数据实时战况</title>
    <script src="https://cdn.jsdelivr.net/npm/echarts@5.5.0/dist/echarts.min.js"></script>
    <script src="https://cdn.bootcdn.net/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script>
    <style>
        body {
            /* 极浅的主题色透明背景 */
            margin: 0; padding: 8px; background-color: rgba(231,76,60,0.04);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            display: flex; flex-direction: column; align-items: center; overflow-x: hidden;
        }
        .container { width: 100%; max-width: 900px; }
        
        /* 顶部日期选择区 */
        .header-bar {
            display: flex; justify-content: center; align-items: center;
            margin-bottom: 12px; gap: 10px;
        }
        .header-bar span {
            color: #e74c3c; font-weight: bold; font-size: 15px;
        }
        .date-select {
            font-size: 15px; font-weight: bold; color: #e74c3c;
            background: white; border: 1px solid rgba(231,76,60,0.35);
            border-radius: 20px; padding: 6px 16px;
            outline: none; appearance: none;
            box-shadow: 0 2px 8px rgba(231,76,60,0.08);
            font-family: inherit;
        }

        /* 卡片风格，带极浅透明底和红润阴影 */
        .card {
            background: rgba(255, 255, 255, 0.95); border-radius: 12px; box-shadow: 0 4px 12px rgba(231,76,60,0.08);
            padding: 12px 0; margin-bottom: 12px; overflow: hidden; border: 1px solid rgba(231,76,60,0.1);
        }
        
        /* 统计框 */
        .stats-wrap { text-align: center; padding: 0 10px; }
        .stats {
            font-size: 12px; font-weight: bold; color: #e74c3c;
            background: rgba(231,76,60,0.05); border: 1px solid rgba(231,76,60,0.2);
            border-radius: 20px; padding: 8px 16px; display: inline-block;
            line-height: 1.5;
        }

        .title {
            text-align: center; color: #e74c3c; font-size: 15px; font-weight: bold; margin: 5px 0 10px 0;
        }
        h3 { text-align: center; color: #e74c3c; margin: 0 0 10px 0; font-size: 15px; }

        /* 表格与图表滑动框 */
        .table-scroll-box, .chart-scroll-box {
            width: 100%; overflow-x: auto; -webkit-overflow-scrolling: touch;
        }
        .table-scroll-box::-webkit-scrollbar, .chart-scroll-box::-webkit-scrollbar { display: none; }
        
        /* 图表容器 */
        .chart-scroll-box { overflow-y: hidden; }
        .chart-wrapper { width: 900px; height: 350px; }

        /* 表格样式 */
        table {
            width: 100%; border-collapse: separate; border-spacing: 0;
            font-size: 12px; min-width: 850px;
        }
        th, td {
            padding: 10px 6px; text-align: center; border-bottom: 1px solid rgba(231,76,60,0.1);
            white-space: nowrap; line-height: 1.5;
        }
        th {
            background-color: #e74c3c; color: #ffffff; font-weight: bold;
            font-size: 12px; position: sticky; top: 0; z-index: 2;
            border: 1px solid rgba(255, 255, 255, 0.2); box-shadow: 0 1px 0 rgba(231,76,60,0.1);
        }
        
        /* 首列固定 */
        th:first-child, td:first-child { 
            text-align: center; color: #e74c3c; position: sticky; left: 0; z-index: 1;
            background-color: #ffffff; font-weight: bold;
        }
        th:first-child { background-color: #e74c3c; color: #ffffff; z-index: 20; }
        tbody tr:nth-child(even) { background-color: rgba(231,76,60,0.03); }
        tbody tr:nth-child(even) td:first-child { background-color: #fcf5f4; }
        
        /* 数值样式 */
        .val-heart { font-weight: bold; color: #333; }
        .val-power { font-weight: bold; color: #333; }
        .val-total { font-weight: bold; color: #333; } 
        
        .up { color: #e74c3c; font-weight: bold; }
        .down { color: #27ae60; font-weight: bold; }
        
        #loading { text-align: center; color: #e74c3c; font-size: 16px; margin-top: 50px; font-weight: bold; }

        /* 适配手机端 */
        @media (max-width: 900px) {
            .chart-wrapper { width: 900px; height: 300px; }
            th, td { padding: 8px 4px; font-size: 11px; }
        }
    </style>
</head>
<body>
    <div class="container">
        <div id="loading">正在加载数据...</div>
        
        <div id="main-content" style="display: none;">
            <!-- 日期选择区 -->
            <div class="card" style="padding: 12px 0; text-align: center;">
                <div class="header-bar">
                    <span>选择查看日期：</span>
                    <select id="dateSelector" class="date-select"></select>
                </div>
                <div class="stats-wrap">
                    <div class="stats" id="tableSumStats"></div>
                </div>
            </div>

            <!-- 表格区域 -->
            <div class="card">
                <h3 id="tableTitle">数据明细</h3>
                <div class="table-scroll-box">
                    <table id="dataTable">
                        <thead>
                            <tr>
                                <th>时间</th>
                                <th>心动人数</th>
                                <th>心动增幅</th>
                                <th>团建电力</th>
                                <th>电力增幅</th>
                                <th>总电力值</th>
                                <th>总电增幅</th>
                            </tr>
                        </thead>
                        <tbody></tbody>
                    </table>
                </div>
            </div>

            <!-- 图表区域 -->
            <div class="card">
                <div class="title" id="chartTitleHeart">心动人数趋势 (👈左右滑动👉)</div>
                <div class="chart-scroll-box">
                    <div class="chart-wrapper" id="chartHeart"></div>
                </div>
            </div>

            <div class="card">
                <div class="title" id="chartTitlePower">团建电力增幅趋势 (👈左右滑动👉)</div>
                <div class="chart-scroll-box">
                    <div class="chart-wrapper" id="chartPower" style="height: 300px;"></div>
                </div>
            </div>

            <div class="card">
                <div class="title" id="chartTitleTotal">总电力增幅趋势 (👈左右滑动👉)</div>
                <div class="chart-scroll-box">
                    <div class="chart-wrapper" id="chartTotal" style="height: 300px;"></div>
                </div>
            </div>
        </div>
    </div>

    <script>
        function parseTimeStr(str) {
            if (!str) return "";
            let parts = str.split(' ');
            if (parts.length > 1) {
                let timeParts = parts[1].split(':');
                if (timeParts.length >= 1) {
                    let hour = parseInt(timeParts[0], 10);
                    return (hour < 10 ? '0' + hour : hour) + ':00';
                }
            }
            return str;
        }

        function formatNum(num) {
            return num ? Number(num).toLocaleString() : '-';
        }

        function formatDelta(num) {
            if (num === null || num === undefined || num === '' || isNaN(num)) return '-';
            const val = Number(num);
            if (val > 0) return `<span class="up">+${val.toLocaleString()}</span>`;
            if (val < 0) return `<span class="down">${val.toLocaleString()}</span>`;
            return '0';
        }

        function getNum(val) {
            if (val === '' || val === undefined || val === null) return null;
            const num = Number(val);
            return isNaN(num) ? null : num;
        }

        // 初始化三个图表
        const chartHeart = echarts.init(document.getElementById('chartHeart'), null, { width: 900, height: 350 });
        const chartPower = echarts.init(document.getElementById('chartPower'), null, { width: 900, height: 300 });
        const chartTotal = echarts.init(document.getElementById('chartTotal'), null, { width: 900, height: 300 });
        
        chartHeart.showLoading();
        chartPower.showLoading();
        chartTotal.showLoading();

        let globalDataMap = {}; 

        Papa.parse('power_data.csv?t=' + new Date().getTime(), {
            download: true,
            header: true,
            skipEmptyLines: true,
            encoding: "UTF-8",
            complete: function(results) {
                document.getElementById('loading').style.display = 'none';
                document.getElementById('main-content').style.display = 'block';

                const data = results.data;
                const datesSet = new Set();

                data.forEach(row => {
                    const timeStr = row["时间"];
                    if (!timeStr) return;

                    const datePart = timeStr.split(' ')[0].replace(/\//g, '-');
                    const dArr = datePart.split('-');
                    if (dArr.length !== 3) return;
                    
                    const formattedDate = `${dArr[0]}-${dArr[1].padStart(2,'0')}-${dArr[2].padStart(2,'0')}`;
                    if (formattedDate < '2026-11-01') return; 

                    const timeHour = parseTimeStr(timeStr);
                    datesSet.add(formattedDate);

                    if (!globalDataMap[formattedDate]) globalDataMap[formattedDate] = {};
                    
                    globalDataMap[formattedDate][timeHour] = {
                        heart: getNum(row["心动人数1"]),
                        heartDelta: getNum(row["增幅"]),
                        power: getNum(row["团建电力值1"]),
                        powerDelta: getNum(row["增幅_1"]),
                        totalPower: getNum(row["总电力值"]),
                        totalDelta: getNum(row["增幅_4"]) 
                    };
                });

                const sortedDates = Array.from(datesSet).sort().reverse(); 
                const selector = document.getElementById('dateSelector');
                
                sortedDates.forEach(date => {
                    const opt = document.createElement('option');
                    opt.value = date;
                    opt.innerText = date;
                    selector.appendChild(opt);
                });

                if (sortedDates.length > 0) {
                    selector.value = sortedDates[0];
                }

                selector.addEventListener('change', (e) => {
                    renderPage(e.target.value);
                });

                renderPage(selector.value);
            },
            error: function(err) {
                document.getElementById('loading').innerText = "加载数据失败，请确保 power_data.csv 在同目录下。";
                console.error(err);
            }
        });

        function renderPage(selectedDate) {
            const dataMap = globalDataMap;
            const selDateObj = new Date(selectedDate);
            const prevDateObj = new Date(selDateObj);
            prevDateObj.setDate(prevDateObj.getDate() - 1);
            const prevDateStr = prevDateObj.toISOString().split('T')[0];

            let selectedTotalDelta = 0;
            let prevTotalDelta = 0;
            
            if (dataMap[selectedDate]) {
                Object.values(dataMap[selectedDate]).forEach(d => {
                    if (d.powerDelta) selectedTotalDelta += d.powerDelta;
                });
            }
            if (dataMap[prevDateStr]) {
                Object.values(dataMap[prevDateStr]).forEach(d => {
                    if (d.powerDelta) prevTotalDelta += d.powerDelta;
                });
            }
            
            function fmtW(v) { return (v / 10000).toFixed(1) + 'w'; }
            document.getElementById('tableSumStats').innerHTML = 
                `${prevDateStr} 团建总增幅: <span style="color:#e74c3c;">${fmtW(prevTotalDelta)}</span><br>${selectedDate} 团建总增幅: <span style="color:#e74c3c;">${fmtW(selectedTotalDelta)}</span>`;
            
            // 标题统一为日期格式
            const shortDate = selectedDate.substring(5);
            document.getElementById('tableTitle').innerText = `${shortDate} · 数据明细 (最近10条)`;
            document.getElementById('chartTitleHeart').innerText = `${shortDate} · 心动人数 (👈左右滑动👉)`;
            document.getElementById('chartTitlePower').innerText = `${shortDate} · 团建电力增幅 (👈左右滑动👉)`;
            document.getElementById('chartTitleTotal').innerText = `${shortDate} · 总电力增幅 (👈左右滑动👉)`;

            let dayDataList = [];
            if (dataMap[selectedDate]) {
                for (const [time, data] of Object.entries(dataMap[selectedDate])) {
                    dayDataList.push({ time, ...data });
                }
                dayDataList.sort((a, b) => b.time.localeCompare(a.time));
            }
            
            const latestRows = dayDataList.slice(0, 10);
            const tbody = document.querySelector('#dataTable tbody');
            tbody.innerHTML = '';

            if (latestRows.length === 0) {
                tbody.innerHTML = '<tr><td colspan="7" style="text-align:center;color:#999;">暂无数据</td></tr>';
            } else {
                latestRows.forEach(row => {
                    const tr = document.createElement('tr');
                    tr.innerHTML = `
                        <td>${row.time}</td>
                        <td class="val-heart">${formatNum(row.heart)}</td>
                        <td>${formatDelta(row.heartDelta)}</td>
                        <td class="val-power">${formatNum(row.power)}</td>
                        <td>${formatDelta(row.powerDelta)}</td>
                        <td class="val-total">${formatNum(row.totalPower)}</td>
                        <td>${formatDelta(row.totalDelta)}</td>
                    `;
                    tbody.appendChild(tr);
                });
            }

            const xAxisHours = [];
            for (let i = 0; i <= 24; i++) {
                xAxisHours.push((i < 10 ? '0'+i : i) + ':00');
            }

            function getSeriesData(date, key) {
                return xAxisHours.map(h => {
                    if (dataMap[date] && dataMap[date][h] && dataMap[date][h][key] !== undefined) {
                        return dataMap[date][h][key];
                    }
                    if (h === '00:00' && dataMap[date]) return 0;
                    return null;
                });
            }

            const heartSeries = [];
            const powerSeries = [];
            const totalSeries = [];
            
            // === 今天（选中日）的数据：橙色 ===
            if (dataMap[selectedDate]) {
                const shortName = selectedDate.substring(5); 
                
                // 图例只写日期
                heartSeries.push({
                    name: shortName, type: 'line', data: getSeriesData(selectedDate, 'heart'),
                    smooth: false, symbol: 'circle', symbolSize: 4, itemStyle: { color: '#FF8C42' }, lineStyle: { color: '#FF8C42', width: 2.5 }
                });
                
                powerSeries.push({
                    name: shortName, type: 'line', data: getSeriesData(selectedDate, 'powerDelta'),
                    smooth: false, symbol: 'circle', symbolSize: 4, itemStyle: { color: '#FF8C42' }, lineStyle: { color: '#FF8C42', width: 2.5 }
                });

                totalSeries.push({
                    name: shortName, type: 'line', data: getSeriesData(selectedDate, 'totalDelta'),
                    smooth: false, symbol: 'circle', symbolSize: 4, itemStyle: { color: '#FF8C42' }, lineStyle: { color: '#FF8C42', width: 2.5 }
                });
            }
            
            // === 昨天（对比日）的数据：粉色 ===
            if (dataMap[prevDateStr]) {
                const shortName = prevDateStr.substring(5);
                
                heartSeries.push({
                    name: shortName, type: 'line', data: getSeriesData(prevDateStr, 'heart'),
                    smooth: false, symbol: 'circle', symbolSize: 4, itemStyle: { color: '#FFB3C6' }, lineStyle: { color: '#FFB3C6', width: 2 }
                });
                
                powerSeries.push({
                    name: shortName, type: 'line', data: getSeriesData(prevDateStr, 'powerDelta'),
                    smooth: false, symbol: 'circle', symbolSize: 4, itemStyle: { color: '#FFB3C6' }, lineStyle: { color: '#FFB3C6', width: 2 }
                });

                totalSeries.push({
                    name: shortName, type: 'line', data: getSeriesData(prevDateStr, 'totalDelta'),
                    smooth: false, symbol: 'circle', symbolSize: 4, itemStyle: { color: '#FFB3C6' }, lineStyle: { color: '#FFB3C6', width: 2 }
                });
            }

            // === 其他历史日期的虚线（全灰色，图例也是灰） ===
            const allDates = Object.keys(dataMap).sort();
            allDates.forEach(date => {
                if (date === selectedDate || date === prevDateStr) return;
                
                const shortName = date.substring(5);
                heartSeries.push({
                    name: shortName, type: 'line', data: getSeriesData(date, 'heart'),
                    smooth: false, symbol: 'none', 
                    itemStyle: { color: '#b0b0b0' }, 
                    lineStyle: { color: '#b0b0b0', width: 1.5, type: 'dashed' },
                    emphasis: { disabled: true }
                });
                powerSeries.push({
                    name: shortName, type: 'line', data: getSeriesData(date, 'powerDelta'),
                    smooth: false, symbol: 'none', 
                    itemStyle: { color: '#b0b0b0' }, 
                    lineStyle: { color: '#b0b0b0', width: 1.5, type: 'dashed' },
                    emphasis: { disabled: true }
                });
                totalSeries.push({
                    name: shortName, type: 'line', data: getSeriesData(date, 'totalDelta'),
                    smooth: false, symbol: 'none', 
                    itemStyle: { color: '#b0b0b0' }, 
                    lineStyle: { color: '#b0b0b0', width: 1.5, type: 'dashed' },
                    emphasis: { disabled: true }
                });
            });

            // 渲染心动图
            chartHeart.hideLoading();
            chartHeart.setOption({
                tooltip: { trigger: 'axis', confine: true },
                legend: { top: '0%', itemWidth: 12, itemHeight: 8, textStyle: { fontSize: 12, color: '#666' }, type: 'scroll' },
                grid: { left: '2%', right: '5%', bottom: '10%', top: '18%', containLabel: true },
                xAxis: { type: 'category', boundaryGap: false, data: xAxisHours, axisLabel: { interval: 0, fontSize: 11, color: '#888' }, axisLine: { lineStyle: { color: 'rgba(231,76,60,0.2)' } } },
                // 去掉了 yAxis 的 name
                yAxis: { type: 'value', scale: true, axisLabel: { fontSize: 11, color: '#888', formatter: function(v) { return v >= 10000 ? (v / 10000) + 'w' : v; } }, axisLine: { lineStyle: { color: 'rgba(231,76,60,0.2)' } }, splitLine: { lineStyle: { color: 'rgba(231,76,60,0.05)' } } },
                series: heartSeries
            }, true);

            // 渲染团建增幅图
            chartPower.hideLoading();
            chartPower.setOption({
                tooltip: { trigger: 'axis', confine: true },
                legend: { top: '0%', itemWidth: 12, itemHeight: 8, textStyle: { fontSize: 12, color: '#666' }, type: 'scroll' },
                grid: { left: '2%', right: '5%', bottom: '10%', top: '18%', containLabel: true },
                xAxis: { type: 'category', boundaryGap: false, data: xAxisHours, axisLabel: { interval: 0, fontSize: 11, color: '#888' }, axisLine: { lineStyle: { color: 'rgba(231,76,60,0.2)' } } },
                // 去掉了 yAxis 的 name
                yAxis: { type: 'value', scale: true, axisLabel: { fontSize: 11, color: '#888', formatter: function(v) { return v >= 1000000 ? (v / 1000000).toFixed(1) + 'm' : v; } }, axisLine: { lineStyle: { color: 'rgba(231,76,60,0.2)' } }, splitLine: { lineStyle: { color: 'rgba(231,76,60,0.05)' } } },
                series: powerSeries
            }, true);

            // 渲染总电增幅图
            chartTotal.hideLoading();
            chartTotal.setOption({
                tooltip: { trigger: 'axis', confine: true },
                legend: { top: '0%', itemWidth: 12, itemHeight: 8, textStyle: { fontSize: 12, color: '#666' }, type: 'scroll' },
                grid: { left: '2%', right: '5%', bottom: '10%', top: '18%', containLabel: true },
                xAxis: { type: 'category', boundaryGap: false, data: xAxisHours, axisLabel: { interval: 0, fontSize: 11, color: '#888' }, axisLine: { lineStyle: { color: 'rgba(231,76,60,0.2)' } } },
                // 去掉了 yAxis 的 name
                yAxis: { type: 'value', scale: true, axisLabel: { fontSize: 11, color: '#888', formatter: function(v) { return v >= 1000000 ? (v / 1000000).toFixed(1) + 'm' : v; } }, axisLine: { lineStyle: { color: 'rgba(231,76,60,0.2)' } }, splitLine: { lineStyle: { color: 'rgba(231,76,60,0.05)' } } },
                series: totalSeries
            }, true);
        }

        let resizeTimer;
        window.addEventListener('resize', function() {
            clearTimeout(resizeTimer);
            resizeTimer = setTimeout(function() {
                chartHeart.resize({ width: 900, height: 350 });
                chartPower.resize({ width: 900, height: 300 });
                chartTotal.resize({ width: 900, height: 300 });
            }, 200);
        });
    </script>
</body>
</html>
