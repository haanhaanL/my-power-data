<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>电力数据监控与图表</title>
    <!-- ECharts 绘图库 -->
    <script src="https://cdn.bootcdn.net/ajax/libs/echarts/5.4.3/echarts.min.js"></script>
    <!-- PapaParse 解析 CSV 库 -->
    <script src="https://cdn.bootcdn.net/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #f4f7f6; margin: 0; padding: 20px; }
        .container { max-width: 1400px; margin: 0 auto; }
        .header { text-align: center; color: #D35400; margin-bottom: 20px; }
        .card { background: white; border-radius: 8px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); padding: 20px; margin-bottom: 20px; }
        .chart-box { width: 100%; height: 450px; } 
        table { width: 100%; border-collapse: collapse; margin-top: 10px; font-size: 14px; }
        th, td { padding: 10px; text-align: center; border-bottom: 1px solid #eee; }
        th { background-color: #f8f9fa; color: #333; font-weight: bold; }
        tr:hover { background-color: #f1f1f1; }
        .title { font-size: 18px; font-weight: bold; color: #333; margin-bottom: 15px; border-left: 4px solid #FF8C42; padding-left: 10px; }
        #loading { text-align: center; color: #666; font-size: 16px; margin-top: 50px; }
    </style>
</head>
<body>
    <div class="container">
        <h1 class="header" id="page-title">数据加载中...</h1>
        <div id="loading">正在从 power_data.csv 读取最新数据...</div>
        
        <div id="main-content" style="display: none;">
            <!-- 表格区域 -->
            <div class="card">
                <div class="title">最近 15 条数据</div>
                <div style="overflow-x:auto;">
                    <table>
                        <thead id="table-head"></thead>
                        <tbody id="table-body"></tbody>
                    </table>
                </div>
            </div>

            <!-- 图表 1：心动人数 -->
            <div class="card">
                <div class="title">心动人数1 对比 (折线)</div>
                <div id="chart-heart" class="chart-box"></div>
            </div>

            <!-- 图表 2：团建电力增幅 -->
            <div class="card">
                <div class="title">团建电力值1 增幅对比 (折线)</div>
                <div id="chart-delta" class="chart-box"></div>
            </div>
        </div>
    </div>

    <script>
        // 1. 解析 CSV 文件
        Papa.parse("power_data.csv", {
            download: true,
            header: true,
            skipEmptyLines: true,
            encoding: "UTF-8",
            complete: function(results) {
                document.getElementById('loading').style.display = 'none';
                document.getElementById('main-content').style.display = 'block';

                let allData = results.data;
                if (allData.length === 0) return;

                // 获取最后一次记录的时间，确定“今天”
                let lastRow = allData[allData.length - 1];
                let lastDateStr = lastRow["时间"].split(" ")[0]; // e.g. "2026/11/2"
                document.getElementById('page-title').innerText = `数据监控 (${lastDateStr})`;

                // 2. 渲染表格（倒序取最近 15 条）
                let headers = Object.keys(allData[0]);
                let thead = document.getElementById('table-head');
                let trHead = document.createElement('tr');
                headers.forEach(h => {
                    let th = document.createElement('th');
                    th.innerText = h;
                    trHead.appendChild(th);
                });
                thead.appendChild(trHead);

                let tbody = document.getElementById('table-body');
                let recentData = allData.slice(-15).reverse();
                recentData.forEach(row => {
                    let tr = document.createElement('tr');
                    headers.forEach(h => {
                        let td = document.createElement('td');
                        td.innerText = row[h] || "";
                        tr.appendChild(td);
                    });
                    tbody.appendChild(tr);
                });

                // 3. 数据清洗：将时间转换为数值坐标
                let todayData = [];
                let yestData = [];
                
                // 简单判断昨天的时间字符串
                let dateParts = lastDateStr.split("/");
                let dateObj = new Date(dateParts[0], dateParts[1] - 1, dateParts[2]);
                dateObj.setDate(dateObj.getDate() - 1);
                let yestDateStr = `${dateObj.getFullYear()}/${dateObj.getMonth() + 1}/${dateObj.getDate()}`;

                allData.forEach(row => {
                    let timeStr = row["时间"];
                    if (!timeStr) return;
                    
                    let datePart = timeStr.split(" ")[0];
                    let timePart = timeStr.split(" ")[1];
                    if (!timePart) return;

                    let hour = parseInt(timePart.split(":")[0]);
                    let minute = parseInt(timePart.split(":")[1]);
                    let floatHour = hour + minute / 60.0; // 将 17:30 转成 17.5

                    let dataPoint = {
                        x: floatHour,
                        heart: parseFloat(row["心动人数1"]) || null,
                        delta: parseFloat(row["增幅"]) || null // 这里取的是团建电力值的增幅
                    };

                    if (datePart === lastDateStr) {
                        todayData.push(dataPoint);
                    } else if (datePart === yestDateStr) {
                        yestData.push(dataPoint);
                    }
                });

                // 提取按小时排列的数据
                let xAxisData = Array.from({length: 25}, (_, i) => i === 24 ? "24:00" : (i < 10 ? "0" + i + ":00" : i + ":00"));
                
                function extractData(dataArr, key) {
                    let res = new Array(25).fill(null);
                    dataArr.forEach(dp => {
                        let h = Math.floor(dp.x);
                        if (h >= 0 && h <= 24 && dp[key] !== null) {
                            res[h] = dp[key]; 
                        }
                    });
                    return res;
                }

                let todayHeart = extractData(todayData, 'heart');
                let yestHeart = extractData(yestData, 'heart');
                let todayDelta = extractData(todayData, 'delta');
                let yestDelta = extractData(yestData, 'delta');

                // 4. 绘制 ECharts
                var chartHeart = echarts.init(document.getElementById('chart-heart'));
                var chartDelta = echarts.init(document.getElementById('chart-delta'));

                // 通用的坐标轴和提示框配置
                var commonOptions = {
                    tooltip: { 
                        trigger: 'axis',
                        axisPointer: { type: 'cross', label: { backgroundColor: '#6a7985' } }
                    },
                    grid: { left: '3%', right: '4%', bottom: '5%', containLabel: true },
                    xAxis: { 
                        type: 'category', 
                        boundaryGap: false, 
                        data: xAxisData, 
                        axisLine: { lineStyle: { color: '#ccc' } } 
                    },
                    yAxis: { 
                        type: 'value', 
                        splitLine: { lineStyle: { type: 'dashed', color: '#eee' } } 
                    }
                };

                // 图表1：心动人数折线图（已去掉平滑，保留渐变填充）
                chartHeart.setOption({
                    ...commonOptions,
                    legend: { data: ['昨天心动人数', '今天心动人数'], top: 0 },
                    series: [
                        { 
                            name: '昨天心动人数', 
                            type: 'line', 
                            smooth: false, // ⭐ 去掉平滑，变成直角折线
                            symbol: 'circle', 
                            symbolSize: 6,
                            itemStyle: { color: '#FFB3C6' }, 
                            areaStyle: { 
                                color: new echarts.graphic.LinearGradient(0, 0, 0, 1, [
                                    { offset: 0, color: 'rgba(255,179,198,0.5)' },
                                    { offset: 1, color: 'rgba(255,179,198,0.0)' }
                                ])
                            }, 
                            data: yestHeart 
                        },
                        { 
                            name: '今天心动人数', 
                            type: 'line', 
                            smooth: false, // ⭐ 去掉平滑，变成直角折线
                            symbol: 'circle', 
                            symbolSize: 6,
                            itemStyle: { color: '#FF8C42' }, 
                            areaStyle: { 
                                color: new echarts.graphic.LinearGradient(0, 0, 0, 1, [
                                    { offset: 0, color: 'rgba(255,140,66,0.5)' },
                                    { offset: 1, color: 'rgba(255,140,66,0.0)' }
                                ])
                            }, 
                            data: todayHeart 
                        }
                    ]
                });

                // 图表2：电力值增幅折线图（已去掉平滑）
                chartDelta.setOption({
                    ...commonOptions,
                    legend: { data: ['昨天增幅', '今天增幅'], top: 0 },
                    series: [
                        { 
                            name: '昨天增幅', 
                            type: 'line', 
                            smooth: false, // ⭐ 去掉平滑，变成直角折线
                            symbol: 'circle', 
                            symbolSize: 6,
                            itemStyle: { color: '#FFB3C6' }, 
                            data: yestDelta 
                        },
                        { 
                            name: '今天增幅', 
                            type: 'line', 
                            smooth: false, // ⭐ 去掉平滑，变成直角折线
                            symbol: 'circle', 
                            symbolSize: 6,
                            itemStyle: { color: '#FF8C42' }, 
                            data: todayDelta 
                        }
                    ]
                });

                // 窗口大小改变时自适应
                window.addEventListener('resize', function() {
                    chartHeart.resize();
                    chartDelta.resize();
                });
            },
            error: function(err) {
                document.getElementById('loading').innerText = "加载数据失败，请确保 power_data.csv 在同目录下。";
                console.error(err);
            }
        });
    </script>
</body>
</html>
